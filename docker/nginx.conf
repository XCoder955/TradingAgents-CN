# 全局核心配置
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

# 事件驱动配置
events {
    worker_connections  1024;
}

# HTTP核心配置块
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 访问日志格式定义
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # 高性能网络配置
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # 客户端请求体大小限制
    client_max_body_size 100M;

    # Gzip压缩（合并两个配置的gzip_types，去重并完整覆盖）
    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/x-javascript 
               application/xml+rss application/json;

    # 上游后端服务集群（API接口代理目标）
    upstream backend {
        server backend:8000;
    }

    # 主服务块：整合前端静态+后端API+健康检查+错误页面
    server {
        listen       80;
        server_name  _ localhost; # 适配任意域名+本地访问，兼顾两个配置的场景
        root   /usr/share/nginx/html; # 前端静态文件根目录
        index  index.html; # 前端默认入口

        # 【精确匹配】健康检查接口（优先级最高）
        location = /health {
            access_log off; # 健康检查不记录日志
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 【精确匹配】前端入口文件：禁止缓存（避免SPA更新后缓存问题）
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # 【正则匹配】JS文件：长期缓存（1年），Immutable防止浏览器重新验证
        location ~* ^/js/.*\.js$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri /index.html; # SPA路由回退
        }

        # 【正则匹配】CSS文件：长期缓存（1年），Immutable防止浏览器重新验证
        location ~* ^/css/.*\.css$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri /index.html; # SPA路由回退
        }

        # 【正则匹配】图片/字体等静态资源：长期缓存（1年），404直接返回不回退
        location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 【后端API代理】/api/前缀接口：含WebSocket支持+禁用缓存+长连接超时
        location /api/ {
            proxy_pass http://backend/api/;
            # 客户端真实IP透传
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket协议支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # 强制禁用缓存（API接口缓存会导致数据不一致）
            proxy_buffering off;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            # 超时配置：WebSocket长连接1小时，普通API连接2分钟
            proxy_connect_timeout 120s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            # 缓冲区配置：避免大响应被截断
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # 【普通匹配】SPA前端主路由：兜底回退到index.html（优先级最低）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 服务器错误页面配置
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}